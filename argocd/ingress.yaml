# Ingress for the Argo CD UI itself. Applied manually as part of the bootstrap
# (alongside application.yaml) — Argo CD doesn't manage its own UI ingress.
#
# argocd-server runs HTTPS internally; backend-protocol "HTTPS" tells nginx to
# speak TLS to it. The internal certificate is self-signed, so the browser will
# show a warning when you first visit — accept it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
